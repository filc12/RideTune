# Verificações automáticas em cada push e em cada pull request.
#
# PORQUE É QUE ISTO EXISTE
# Em 4 de agosto de 2026 um erro de sintaxe no `mfzSuspensionData.ts` passou por duas
# revisões e só apareceu no `eas update`, que falhou a compilar. A app esteve com o
# bundle partido no repositório sem ninguém saber. O `tsc` apanhava-o em segundos.
# O `verificar-coerencia` não apanhou, e não devia mesmo — corre em `tsx`, que tolera
# coisas que o Metro rejeita. NÃO é um teste de compilação.
#
# O QUE ESTE FICHEIRO FAZ E NÃO FAZ
# Faz: verificação estática, sem rede, em um a dois minutos.
# Não faz: build Android ou iOS, publicação de OTA, nada que gaste cota do EAS.
#
# SECRETS NECESSÁRIOS
# O último passo, o `verificar-sync`, precisa de duas variáveis em
# Settings → Secrets and variables → Actions:
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_ANON_KEY
# Ambas estão em claro no `frontend/eas.json`, que está no Git — a anon key do Supabase
# é pública por desenho e está protegida por RLS. Copiar de lá.
# Sem os secrets, esse passo falha mas não trava o resto: tem `continue-on-error`.

name: Verificar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite arrancar à mão pelo separador Actions do GitHub.
  workflow_dispatch:

jobs:
  verificar:
    name: Tipos e coerência dos dados
    runs-on: ubuntu-latest

    defaults:
      run:
        # Todo o projeto Expo vive em frontend/. O package.json da raiz não existe.
        working-directory: frontend

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` em vez de `npm install`: instala exatamente o que está no lockfile e
      # falha se o package.json e o package-lock.json estiverem dessincronizados. É o
      # que se quer numa verificação — reprodutível e sem surpresas.
      - name: Instalar dependências
        run: npm ci

      # O passo que teria apanhado o erro de 4 de agosto.
      - name: Verificar tipos (tsc)
        run: npm run typecheck

      # Apanha afinadores cuja tabela por carga contradiz o sentido de contagem
      # declarado. Sai com código 1 se aparecer uma suspeita NOVA — as já investigadas
      # estão na lista CONHECIDOS do próprio script, com a razão escrita.
      - name: Verificar coerência dos dados de suspensão
        run: npm run verificar-coerencia

      # Confirma que os perfis com pré-carga medida no manual continuam a reproduzir a
      # coluna «Full payload» desse manual. Apanha alterações à fórmula, ao valor base ou
      # ao preloadKgPerTurn que estraguem contas já verificadas.
      - name: Verificar pré-carga contra os manuais
        run: npm run verificar-precarga

      # A app é métrica por dentro e converte só na apresentação. Isto confirma que o
      # número não foge ao ir a quilos e voltar — 287 valores em libras, um a um.
      - name: Verificar conversão de unidades
        run: npm run verificar-unidades

      # Compara o bundle com o Supabase e sai com código 1 a qualquer diferença.
      #
      # PORQUE É QUE ISTO PASSOU A CORRER. Em 11 de agosto de 2026 acrescentaram-se três
      # motos ao bundle e esqueceu-se o Supabase. Como a app arranca com o bundle e depois
      # deixa o Supabase sobrepor-se, as motos apareciam e desapareciam sozinhas — e quem
      # deu por isso foi o dono da app a olhar para o telemóvel, não o CI. Este passo
      # existia desde 4 de agosto, escrito de propósito para apanhar exactamente isto, e
      # esteve comentado todo esse tempo à espera de dois secrets.
      #
      # `continue-on-error` é deliberado: uma divergência de dados não deve impedir um
      # merge, mas tem de ficar visível. Se se preferir bloquear, basta tirar a linha.
      - name: Verificar sincronia com o Supabase
        continue-on-error: true
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx tsx scripts/verificar-sync.ts
